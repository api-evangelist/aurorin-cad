aid: aurorin-cad
name: Aurorin CAD
description: Aurorin CAD is a San Francisco company building a modern mechanical CAD application
  for engineers and hardware teams, founded in 2026 by Michael Baron and backed by Y Combinator
  (Winter 2026 batch). Rather than layering on top of the geometry kernels that underpin
  incumbent tools such as SolidWorks, NX, Creo, CATIA, Fusion 360 and Onshape, Aurorin has written
  its own parametric, B-Rep driven CAD kernel designed to exploit modern multi-core CPUs and GPUs
  and to be AI-native from the foundation rather than as a bolted-on assistant. The product ships
  as a native desktop application for macOS and Windows, pairing conventional direct and parametric
  editing with an integrated AI agent driven through a chat interface, with the stated goal of
  collapsing modeling work that traditionally takes twenty minutes into seconds and avoiding the
  slow rebuilds and cascading feature breakage common to older parametric systems. As of this
  enrichment pass the company publishes no public API, developer portal, SDK or API documentation;
  its public surface is a marketing site, a blog, an about/contact page, and careers listings.
